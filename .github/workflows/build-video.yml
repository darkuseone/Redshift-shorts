name: build-video

# Основной прогон сборки ролика (§7.6, §13).
# Все ключи приходят из GitHub Secrets и никогда не попадают в логи и артефакты
# (редактирование секретов встроено в форматтер логов, см. src/lib/logging.py).

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Путь к JSON-сценарию в репозитории"
        required: true
        default: "scripts/redshift_0042.json"
      providers_mode:
        description: "Режим внешних сервисов"
        required: true
        default: "auto"
        type: choice
        options: [auto, live, mock]
      from_step:
        description: "Возобновить с шага (P0…P12), пусто = фаза 1 с начала"
        required: false
        default: ""
      force:
        description: "Игнорировать кэш шагов (не включает paid API)"
        required: false
        default: false
        type: boolean
      skip_vision:
        description: "Без live Grok/Gemini vision: P8 + P12 semantic QC; thumbs = ffmpeg"
        required: false
        default: false
        type: boolean
      skip_generate:
        description: "Без image gen: P9 + P12 AI thumbs (сразу ffmpeg, без Gemini/Grok image)"
        required: false
        default: false
        type: boolean
      heygen_source:
        description: "Источник аватара: prepared (по умолчанию) | auto | api"
        required: false
        default: "prepared"
      voice_probe:
        description: "Только проба голоса: что TTS отдаёт на этом тарифе (цент вместо прогона)"
        required: false
        default: false
        type: boolean
      probe_formats:
        description: "Форматы пробы через запятую (пусто = как в конфиге)"
        required: false
        default: ""
      probe_model:
        description: "Модель синтеза для пробы (пусто = как в конфиге)"
        required: false
        default: ""
  push:
    paths:
      - "config/ci_build_request.json"

concurrency:
  group: build-video-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Проба голоса живёт и отдельным workflow (`voice-probe.yml`), но тот
  # диспатчится только с ветки по умолчанию — правило GitHub, не наше. Пока
  # правка не влита, спросить сервис можно отсюда: это тот же цент, и сборка при
  # этом не запускается вовсе.
  probe:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.voice_probe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Кэш ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/.local/ffmpeg
          key: ffmpeg-static-linux64-gpl-v1
      - name: Поставить ffmpeg
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.local/ffmpeg/bin/ffmpeg" ]; then
            mkdir -p "$HOME/.local/ffmpeg"
            curl -sSL -o /tmp/ffmpeg.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz -C "$HOME/.local/ffmpeg" --strip-components=1
          fi
          echo "$HOME/.local/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Проба голоса
        run: |
          set -euo pipefail
          # Каталог создаётся до конвейера: tee открывает файл раньше, чем
          # python успевает сделать mkdir, и прогон 33570833947 упал на этом,
          # уже получив ответ сервиса.
          mkdir -p work
          python -m src.cli --pretty-logs \
            ${{ github.event.inputs.probe_model != '' && format('--set elevenlabs.model={0}', github.event.inputs.probe_model) || '' }} \
            voice-probe \
            --formats "${{ github.event.inputs.probe_formats }}" \
            --out work/voice_probe.wav | tee work/voice_probe.json
      - name: Итог в Summary
        if: always()
        run: |
          echo '## Проба голоса' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          sed -n '/^{/,$p' work/voice_probe.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-probe
          path: |
            work/voice_probe*.wav
            work/voice_probe.json
          retention-days: 7
          if-no-files-found: ignore

  build:
    if: github.event_name == 'push' || github.event.inputs.voice_probe != 'true'
    runs-on: ubuntu-latest
    # Фаза 1 коммитит голос и заявку на клипы. mp4 в git не кладётся —
    # только артефакт Actions / S3. contents:write нужен для voice + avatar_request.
    permissions:
      contents: write
    # Один edit-план, один mp4. Поиск футажа ~40 мин, рендер одной версии ~10.
    timeout-minutes: 150
    env:
      # Версия движка рендера пиньнится: та же, что в package.json.
      # Обновление меняет и ключ кэша Chrome.
      HYPERFRAMES_VERSION: "0.8.26"
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      HEYGEN_API: ${{ secrets.HEYGEN_API }}
      # Look id только из config.yaml (heygen.avatar_id), не из секрета.
      # Vision: Grok primary, Gemini только если Grok недоступен. GLM выведен.
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      XAI_API: ${{ secrets.XAI_API }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      REDSHIFT_S3_BUCKET: ${{ secrets.REDSHIFT_S3_BUCKET }}
      REDSHIFT_S3_ENDPOINT: ${{ secrets.REDSHIFT_S3_ENDPOINT }}
      REDSHIFT_S3_ACCESS_KEY: ${{ secrets.REDSHIFT_S3_ACCESS_KEY }}
      REDSHIFT_S3_SECRET_KEY: ${{ secrets.REDSHIFT_S3_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      # Cursor не умеет workflow_dispatch токеном агента. Заявка в git —
      # единственный триггер станка с feature-ветки. --force-paid из JSON
      # игнорируется (tools/ci_build_request.py).
      - name: Параметры сборки
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SCRIPT: ${{ github.event.inputs.script }}
          INPUT_MODE: ${{ github.event.inputs.providers_mode }}
          INPUT_FROM: ${{ github.event.inputs.from_step }}
          INPUT_HEYGEN: ${{ github.event.inputs.heygen_source }}
          INPUT_SKIP_GENERATE: ${{ github.event.inputs.skip_generate }}
          INPUT_SKIP_VISION: ${{ github.event.inputs.skip_vision }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: python3 tools/ci_build_request.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ffmpeg в образе ubuntu-latest не поставляется, а зеркало apt его
      # выдаёт непредсказуемо: прогон №3 качал libcodec2 шестнадцать минут и
      # был снят вручную, прогон №4 упёрся в потолок на том же месте. Два
      # прогона подряд умерли не на своей задаче, а на установке зависимости.
      #
      # Поэтому бинарь берётся статической сборкой с релизов GitHub — оттуда же,
      # откуда раннер тянет и сам себя, — и кладётся в кэш: со второго прогона
      # шаг не ходит в сеть вообще. Сборка скользящая (тег latest), и это
      # осознанный размен: воспроизводимость версии ffmpeg здесь стоит меньше,
      # чем прогон, который доходит до конца.
      - name: Кэш ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/.local/ffmpeg
          key: ffmpeg-static-linux64-gpl-v1

      - name: Поставить ffmpeg
        timeout-minutes: 10
        run: |
          set -euo pipefail
          BIN="$HOME/.local/ffmpeg"
          if [ ! -x "$BIN/ffmpeg" ]; then
            mkdir -p "$BIN"
            curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              -o /tmp/ffmpeg.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz --strip-components=2 -C "$BIN" \
              ffmpeg-master-latest-linux64-gpl/bin/ffmpeg \
              ffmpeg-master-latest-linux64-gpl/bin/ffprobe
            rm -f /tmp/ffmpeg.tar.xz
          fi
          echo "$BIN" >> "$GITHUB_PATH"
          # ffprobe проверяется наравне с ffmpeg: конвейер меряет им длительность
          # каждого клипа, и его отсутствие вскрылось бы только на P6.
          "$BIN/ffmpeg" -version | head -1
          "$BIN/ffprobe" -version | head -1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Движок рендера: HTML-композиция собирается headless Chrome, кадры
      # исходных видео извлекает ffmpeg. Ключи HeyGen тут не нужны — CLI
      # открытый и рендерит локально. Версия — из package-lock.json.
      - name: Установить HyperFrames
        run: |
          npm ci
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> $GITHUB_PATH

      - name: Проверить CLI HyperFrames
        run: |
          hyperframes --version
          version=$(hyperframes --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          test "$version" = "${{ env.HYPERFRAMES_VERSION }}"

      - name: Кэш headless Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/hyperframes/chrome
          key: hyperframes-chrome-${{ env.HYPERFRAMES_VERSION }}

      - name: Подготовить Chrome и проверить окружение
        run: |
          hyperframes browser ensure
          hyperframes doctor || true

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Проверить шрифты (кириллица + лицензия)
        run: python -m src.cli fonts-check

      - name: Валидация сценария
        run: python -m src.cli validate --script "${{ steps.request.outputs.script }}"

      # Голос и клипы ведущего рождаются парой: клипы липсинка сгенерированы под
      # конкретную озвучку, и разойтись им нельзя. Клипы лежат в git, а голос
      # до сих пор жил только в кэше Actions — и когда кэш терялся, пара
      # распадалась: переозвучка сдвигала границы фраз, и P6 отбраковывал все
      # клипы разом. Так это и случилось дважды.
      #
      # Поэтому голос — такой же входной артефакт репозитория, как и клипы.
      # Здесь он раскладывается в work/, и прогон с --from P4 воспроизводит
      # P4-P6 детерминированно, ничего не завися от кэша.
      - name: Засеять work/ готовым голосом
        run: |
          set -euo pipefail
          video_id=$(python -c "import json; print(json.load(open('${{ steps.request.outputs.script }}', encoding='utf-8'))['meta']['video_id'])")
          seed="assets/voice/$video_id"
          if [ -d "$seed" ]; then
            mkdir -p "work/$video_id"
            cp -v "$seed"/voice_final.wav "$seed"/*.json "work/$video_id"/
            echo "голос взят из репозитория: $seed"
          else
            echo "готового голоса для $video_id нет — P2 озвучит заново"
          fi

      # Ключ кэша считается по **речи** сценария, а не по всему файлу. Голос
      # зависит только от текстов блоков; поисковый запрос футажа, visual_intent
      # и подсказка шаблона на него не влияют никак. Пока ключом был файл
      # целиком, правка одной строки запроса обнуляла кэш — а вместе с ним
      # уезжала озвучка: ElevenLabs озвучивал заново, границы фраз сдвигались,
      # и клипы ведущего из репозитория шли в брак как уехавший липсинк. Так
      # уже случалось дважды, и цена ошибки — оба сервиса разом.
      - name: Ключ кэша по речи сценария
        id: speech_key
        run: |
          set -euo pipefail
          key=$(python - <<'EOF'
          import hashlib, json, os
          script = os.environ["SCRIPT"]
          data = json.load(open(script, encoding="utf-8"))
          text = "\n".join(str(b.get("text") or "") for b in data["blocks"])
          print(hashlib.sha256(text.encode("utf-8")).hexdigest()[:16])
          EOF
          )
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "ключ кэша по речи: $key"
        env:
          SCRIPT: ${{ steps.request.outputs.script }}

      # Три ключа восстановления, от точного к общему. Первый — по речи, второй
      # — прежний формат по всему файлу сценария: без него кэш, сохранённый до
      # этой правки, стал бы недостижим, и прогон переозвучил бы ролик заново.
      # Третий ловит любой прошлый прогон: пустой work/ здесь не ошибка, а
      # только потерянное время.
      - name: Восстановить кэш прогонов
        uses: actions/cache/restore@v4
        with:
          path: |
            work
            .redshift_cache
          key: redshift-work-${{ steps.speech_key.outputs.key }}-${{ github.run_id }}
          restore-keys: |
            redshift-work-${{ steps.speech_key.outputs.key }}-
            redshift-work-${{ hashFiles(steps.request.outputs.script) }}-
            redshift-work-

      - name: Сборка ролика
        run: |
          set -o pipefail
          # Журнал сборки пишется рядом с выводом: логи Actions читаются через
          # API кусками с конца, и строка с ошибкой в них не попадает — на
          # прогоне 33666703565 три попытки вытащить её не дали ничего.
          # Файл же уезжает в артефакт и в Summary целиком.
          mkdir -p output
          HEYGEN_SRC="${{ steps.request.outputs.heygen_source }}"
          if [ -z "$HEYGEN_SRC" ]; then HEYGEN_SRC=prepared; fi
          PACE_ARGS=()
          if [ -n "${{ steps.request.outputs.tts_pace }}" ]; then
            PACE_ARGS=(--set elevenlabs.pace=${{ steps.request.outputs.tts_pace }})
          fi
          python -m src.cli \
            --set providers.mode=${{ steps.request.outputs.providers_mode }} \
            --set vision.primary=grok \
            --set heygen.source="$HEYGEN_SRC" \
            "${PACE_ARGS[@]}" \
            ${{ steps.request.outputs.skip_vision == 'true' && '--set vision.skip_live=true' || '' }} \
            ${{ steps.request.outputs.skip_generate == 'true' && '--set generation.skip=true' || '' }} \
            run --script "${{ steps.request.outputs.script }}" \
            ${{ steps.request.outputs.from_step != '' && format('--from {0}', steps.request.outputs.from_step) || '' }} \
            ${{ steps.request.outputs.force == 'true' && '--force' || '' }} \
            2>&1 | tee output/build.log

      # Кэш сохраняется явно и обязательно на любом исходе. Единый actions/cache
      # свой post-шаг на упавшей задаче не выполняет — а фаза 1 двухфазного
      # конвейера заканчивается падением всегда: P6 останавливает прогон, потому
      # что клипов ведущего ещё нет. Из-за этого work/ вместе с voice_final.wav
      # умирал с раннером, и возобновление с P6 падало на MISSING_STEP_INPUT,
      # не найдя ничего от фазы 1. Шов между фазами не закрывался никогда.
      #
      # Переозвучить вместо этого нельзя: TTS недетерминирован, длительности
      # кусков речи уедут, и клипы, сгенерированные под прежнюю речь, будут
      # отбракованы как уехавший липсинк. Речь фазы 1 обязана дожить до фазы 3.
      - name: Сохранить кэш прогонов
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            work
            .redshift_cache
          key: redshift-work-${{ steps.speech_key.outputs.key }}-${{ github.run_id }}

      # mp4 в git не кладётся. QC-пакет (сетка кадров + wav хук/середина/финал)
      # уезжает артефактом вместе с роликом.
      - name: Состав QC-пакета
        if: success()
        run: |
          set -euo pipefail
          for d in output/*/qc_pack; do
            [ -d "$d" ] || continue
            echo "=== $d ==="
            find "$d" -type f | sed 's|^|  |'
          done

      # LRU кэша футажа на раннере. В git файлы библиотеки больше не кладём.
      - name: Вытеснить лишнее из локального кэша материала
        if: always()
        run: python -m src.cli maintenance 2>&1 | tail -20 || true

      # Голос переживает прогон только в кэше, а кэш терялся уже трижды. Пара
      # «голос + клипы ведущего» при этом неразрывна: переозвучка сдвигает
      # границы фраз, и P6 бракует все клипы разом. Поэтому голос уезжает в
      # репозиторий тем же коммитом, что и заявка на клипы.
      # `always()`, а не `success()`: фаза 1 двухфазного конвейера заканчивается
      # падением **всегда** — P6 останавливает прогон, потому что клипов ведущего
      # ещё нет. Ровно в этот момент голос и заявка на клипы и нужны в
      # репозитории.
      - name: Готовый голос и заявка на клипы — в репозиторий
        if: always()
        run: |
          set -euo pipefail
          video_id=$(python -c "import json; print(json.load(open('${{ steps.request.outputs.script }}', encoding='utf-8'))['meta']['video_id'])")
          src="work/$video_id"
          dst="assets/voice/$video_id"
          if [ -f "$src/voice_final.wav" ]; then
            mkdir -p "$dst"
            cp -v "$src/voice_final.wav" "$dst"/
            for name in speech_map draft_plan validated_script; do
              cp -v "$src/$name.json" "$dst"/ 2>/dev/null || true
            done
            du -sh "$dst"
          else
            echo "голоса в work/ нет — нечего сохранять"
          fi
          if [ -f "$src/avatar_request.json" ]; then
            clips="assets/avatar_clips/$video_id"
            mkdir -p "$clips"
            cp -v "$src/avatar_request.json" "$clips"/
            python - "$src" "$clips" <<'EOF'
          import json, shutil, sys
          from pathlib import Path
          src, dst = Path(sys.argv[1]), Path(sys.argv[2])
          req = json.loads((src / "avatar_request.json").read_text(encoding="utf-8"))
          for seg in req.get("segments", []):
              name = f"seg_{int(seg['index']):02d}.wav"
              wav = src / "avatar" / name
              if wav.exists():
                  shutil.copy2(wav, dst / name)
                  print("речь сегмента:", name, wav.stat().st_size, "байт")
          EOF
          fi

      # Тоже `always()`: коммитить после падения фазы 1 есть что — голос и
      # заявку на клипы. mp4 и сырой сток в коммит не входят.
      - name: Голос и заявка на клипы в коммит
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "redshift-bot"
          git config user.email "redshift-bot@users.noreply.github.com"
          git add assets/voice assets/avatar_clips \
                  config/editing_preferences.json config/pronunciation.json \
                  templates/manifest.json cache/footage_index.json \
                  instruction.md rejected_patterns.md || true
          # mp4 никогда не в git (превью и сток — артефакт / S3).
          git diff --cached --name-only -z | grep -zE '\.mp4$' | xargs -0 -r git restore --staged --
          if git diff --cached --quiet; then
            echo "нечего коммитить"
            exit 0
          fi
          git commit -m "chore(run): голос и заявка на клипы после фазы 1"
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            if git fetch origin "$branch" \
               && git rebase "origin/$branch" \
               && git push origin "HEAD:$branch"; then
              echo "запушено с попытки $attempt"
              exit 0
            fi
            git rebase --abort || true
            echo "пуш не прошёл, попытка $attempt"
            sleep $((attempt * 5))
          done
          echo "::error::не удалось запушить голос и заявку на клипы"
          exit 1

      - name: Выложить артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redshift-output
          path: |
            output/build.log
            output/**/*.mp4
            output/**/*.jpg
            output/**/*.wav
            output/**/*.srt
            output/**/*.json
            output/**/qc_pack/**
            output/**/logs/**
          retention-days: 14
          if-no-files-found: warn

      # Фаза 1 двухфазного конвейера: ключа HeyGen у прогона нет, поэтому P6
      # останавливается и оставляет заявку с нарезанными кусками речи. По ним
      # аватар генерируется снаружи через MCP-коннектор и возвращается в репо.
      - name: Выложить заявку на аватар
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-request
          path: |
            work/*/avatar_request.json
            work/*/avatar/seg_*.wav
            work/*/voice_final.wav
            work/*/speech_map.json
            work/*/draft_plan.json
            work/*/validated_script.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Итог в Summary
        if: always()
        run: |
          echo "## REDSHIFT — результат прогона" >> $GITHUB_STEP_SUMMARY
          echo "- заявка: \`${{ steps.request.outputs.script }}\` from_step=\`${{ steps.request.outputs.from_step }}\` heygen=prepared vision=grok" >> $GITHUB_STEP_SUMMARY
          echo "- версий монтажа: **одна**" >> $GITHUB_STEP_SUMMARY
          if [ -f output/build.log ] && grep -q '"code":' output/build.log; then
            echo "### Прогон упал" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            sed -n '/^{$/,$p' output/build.log | head -60 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "===== ОШИБКА ПРОГОНА (повтор в конец журнала) ====="
            sed -n '/^{$/,$p' output/build.log | head -60
          fi
          for report in output/*/build_report.json; do
            [ -f "$report" ] || continue
            echo "### $(dirname "$report")" >> $GITHUB_STEP_SUMMARY
            python - "$report" >> $GITHUB_STEP_SUMMARY <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          print(f"- статус: **{data.get('status','?')}**")
          for variant, qc in (data.get("qc") or {}).items():
              status = "✅" if qc.get("passed") else "❌"
              print(f"- QC: {status} "
                    f"({qc.get('passed_count','?')}/{qc.get('total','?')} проверок)")
          PY
          done
