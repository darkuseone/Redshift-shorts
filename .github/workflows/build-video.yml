name: build-video

# Основной прогон сборки ролика (§7.6, §13).
# Все ключи приходят из GitHub Secrets и никогда не попадают в логи и артефакты
# (редактирование секретов встроено в форматтер логов, см. src/lib/logging.py).

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Путь к JSON-сценарию в репозитории"
        required: true
        default: "scripts/redshift_0042.json"
      providers_mode:
        description: "Режим внешних сервисов"
        required: true
        default: "auto"
        type: choice
        options: [auto, live, mock]
      from_step:
        description: "Возобновить с шага (P0…P12), пусто = с начала"
        required: false
        default: ""
      force:
        description: "Игнорировать кэш шагов"
        required: false
        default: false
        type: boolean

concurrency:
  group: build-video-${{ github.event.inputs.script }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Прогон коммитит в ветку превью ролика, библиотеки и индексы. По умолчанию
    # токен задачи только читает, и пуш возвращал 403 «Permission denied to
    # github-actions[bot]» — прежний `git push || echo` это прятал, и превью
    # молча никуда не уезжало (прогон №33513667380).
    permissions:
      contents: write
    # Весь путь P4-P12 за один прогон: поиск футажа около 40 минут, рендер двух
    # версий ещё 20. На кэш между прогонами опираться нельзя — он терялся даже
    # через три минуты после сохранения, — поэтому сборка должна укладываться
    # целиком, а не по частям.
    timeout-minutes: 150
    env:
      # Версия движка рендера пиньнится: обновление меняет и ключ кэша Chrome.
      HYPERFRAMES_VERSION: "0.8.2"
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
      # Vision обеих ступеней §7.3 — Grok по этому ключу. NASA и Internet
      # Archive работают анонимно, Gemini из рабочего набора выведен.
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      REDSHIFT_S3_BUCKET: ${{ secrets.REDSHIFT_S3_BUCKET }}
      REDSHIFT_S3_ENDPOINT: ${{ secrets.REDSHIFT_S3_ENDPOINT }}
      REDSHIFT_S3_ACCESS_KEY: ${{ secrets.REDSHIFT_S3_ACCESS_KEY }}
      REDSHIFT_S3_SECRET_KEY: ${{ secrets.REDSHIFT_S3_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ffmpeg в образе ubuntu-latest не поставляется, а зеркало apt его
      # выдаёт непредсказуемо: прогон №3 качал libcodec2 шестнадцать минут и
      # был снят вручную, прогон №4 упёрся в потолок на том же месте. Два
      # прогона подряд умерли не на своей задаче, а на установке зависимости.
      #
      # Поэтому бинарь берётся статической сборкой с релизов GitHub — оттуда же,
      # откуда раннер тянет и сам себя, — и кладётся в кэш: со второго прогона
      # шаг не ходит в сеть вообще. Сборка скользящая (тег latest), и это
      # осознанный размен: воспроизводимость версии ffmpeg здесь стоит меньше,
      # чем прогон, который доходит до конца.
      - name: Кэш ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/.local/ffmpeg
          key: ffmpeg-static-linux64-gpl-v1

      - name: Поставить ffmpeg
        timeout-minutes: 10
        run: |
          set -euo pipefail
          BIN="$HOME/.local/ffmpeg"
          if [ ! -x "$BIN/ffmpeg" ]; then
            mkdir -p "$BIN"
            curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              -o /tmp/ffmpeg.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz --strip-components=2 -C "$BIN" \
              ffmpeg-master-latest-linux64-gpl/bin/ffmpeg \
              ffmpeg-master-latest-linux64-gpl/bin/ffprobe
            rm -f /tmp/ffmpeg.tar.xz
          fi
          echo "$BIN" >> "$GITHUB_PATH"
          # ffprobe проверяется наравне с ffmpeg: конвейер меряет им длительность
          # каждого клипа, и его отсутствие вскрылось бы только на P6.
          "$BIN/ffmpeg" -version | head -1
          "$BIN/ffprobe" -version | head -1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Движок рендера: HTML-композиция собирается headless Chrome, кадры
      # исходных видео извлекает ffmpeg. Ключи HeyGen тут не нужны — CLI
      # открытый и рендерит локально.
      - name: Установить HyperFrames
        run: |
          npm install -g hyperframes@${{ env.HYPERFRAMES_VERSION }}
          hyperframes --version

      - name: Кэш headless Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/hyperframes/chrome
          key: hyperframes-chrome-${{ env.HYPERFRAMES_VERSION }}

      - name: Подготовить Chrome и проверить окружение
        run: |
          hyperframes browser ensure
          hyperframes doctor || true

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Проверить шрифты (кириллица + лицензия)
        run: python -m src.cli fonts-check

      - name: Валидация сценария
        run: python -m src.cli validate --script "${{ github.event.inputs.script }}"

      # Голос и клипы ведущего рождаются парой: клипы липсинка сгенерированы под
      # конкретную озвучку, и разойтись им нельзя. Клипы лежат в git, а голос
      # до сих пор жил только в кэше Actions — и когда кэш терялся, пара
      # распадалась: переозвучка сдвигала границы фраз, и P6 отбраковывал все
      # клипы разом. Так это и случилось дважды.
      #
      # Поэтому голос — такой же входной артефакт репозитория, как и клипы.
      # Здесь он раскладывается в work/, и прогон с --from P4 воспроизводит
      # P4-P6 детерминированно, ничего не завися от кэша.
      - name: Засеять work/ готовым голосом
        run: |
          set -euo pipefail
          video_id=$(python -c "import json; print(json.load(open('${{ github.event.inputs.script }}', encoding='utf-8'))['meta']['video_id'])")
          seed="assets/voice/$video_id"
          if [ -d "$seed" ]; then
            mkdir -p "work/$video_id"
            cp -v "$seed"/voice_final.wav "$seed"/*.json "work/$video_id"/
            echo "голос взят из репозитория: $seed"
          else
            echo "готового голоса для $video_id нет — P2 озвучит заново"
          fi

      # Ключ кэша считается по **речи** сценария, а не по всему файлу. Голос
      # зависит только от текстов блоков; поисковый запрос футажа, visual_intent
      # и подсказка шаблона на него не влияют никак. Пока ключом был файл
      # целиком, правка одной строки запроса обнуляла кэш — а вместе с ним
      # уезжала озвучка: ElevenLabs озвучивал заново, границы фраз сдвигались,
      # и клипы ведущего из репозитория шли в брак как уехавший липсинк. Так
      # уже случалось дважды, и цена ошибки — оба сервиса разом.
      - name: Ключ кэша по речи сценария
        id: speech_key
        run: |
          set -euo pipefail
          key=$(python - <<'EOF'
          import hashlib, json, os
          script = os.environ["SCRIPT"]
          data = json.load(open(script, encoding="utf-8"))
          text = "\n".join(str(b.get("text") or "") for b in data["blocks"])
          print(hashlib.sha256(text.encode("utf-8")).hexdigest()[:16])
          EOF
          )
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "ключ кэша по речи: $key"
        env:
          SCRIPT: ${{ github.event.inputs.script }}

      # Три ключа восстановления, от точного к общему. Первый — по речи, второй
      # — прежний формат по всему файлу сценария: без него кэш, сохранённый до
      # этой правки, стал бы недостижим, и прогон переозвучил бы ролик заново.
      # Третий ловит любой прошлый прогон: пустой work/ здесь не ошибка, а
      # только потерянное время.
      - name: Восстановить кэш прогонов
        uses: actions/cache/restore@v4
        with:
          path: |
            work
            .redshift_cache
          key: redshift-work-${{ steps.speech_key.outputs.key }}-${{ github.run_id }}
          restore-keys: |
            redshift-work-${{ steps.speech_key.outputs.key }}-
            redshift-work-${{ hashFiles(github.event.inputs.script) }}-
            redshift-work-

      - name: Сборка ролика (A и B)
        run: |
          python -m src.cli \
            --set providers.mode=${{ github.event.inputs.providers_mode }} \
            run --script "${{ github.event.inputs.script }}" \
            ${{ github.event.inputs.from_step != '' && format('--from {0}', github.event.inputs.from_step) || '' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      # Кэш сохраняется явно и обязательно на любом исходе. Единый actions/cache
      # свой post-шаг на упавшей задаче не выполняет — а фаза 1 двухфазного
      # конвейера заканчивается падением всегда: P6 останавливает прогон, потому
      # что клипов ведущего ещё нет. Из-за этого work/ вместе с voice_final.wav
      # умирал с раннером, и возобновление с P6 падало на MISSING_STEP_INPUT,
      # не найдя ничего от фазы 1. Шов между фазами не закрывался никогда.
      #
      # Переозвучить вместо этого нельзя: TTS недетерминирован, длительности
      # кусков речи уедут, и клипы, сгенерированные под прежнюю речь, будут
      # отбракованы как уехавший липсинк. Речь фазы 1 обязана дожить до фазы 3.
      - name: Сохранить кэш прогонов
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            work
            .redshift_cache
          key: redshift-work-${{ steps.speech_key.outputs.key }}-${{ github.run_id }}

      # Артефакт Actions заказчику недоступен — ни скачать, ни открыть. Поэтому
      # рядом с ним кладётся лёгкое превью: 720p, CRF 30, звук 96k. Обе версии
      # вместе весят около десяти мегабайт, живут в репозитории рядом с голосом
      # и клипами ведущего и доезжают до чата, где их наконец можно посмотреть.
      # Каждый прогон перезаписывает превью своего ролика — репозиторий от
      # этого не растёт.
      #
      # 540p было мало: на превью прогона №33515561869 обводка субтитров (6-8 px
      # по §4.2) сжималась до трёх пикселей, тёмно-красный сливался с белым, и
      # слово читалось красным — дефект, которого в самом ролике нет. Отсюда и
      # lanczos: он держит край буквы при уменьшении вдвое, а не размывает его.
      - name: Лёгкое превью ролика
        if: success()
        run: |
          set -euo pipefail
          video_id=$(python -c "import json; print(json.load(open('${{ github.event.inputs.script }}', encoding='utf-8'))['meta']['video_id'])")
          out="assets/preview/$video_id"
          rm -rf "$out" && mkdir -p "$out"
          for f in output/"$video_id"/*.mp4; do
            [ -f "$f" ] || continue
            ffmpeg -v error -y -i "$f" -vf "scale=720:-2:flags=lanczos" \
              -c:v libx264 -preset veryfast -crf 30 -pix_fmt yuv420p \
              -c:a aac -b:a 96k -movflags +faststart \
              "$out/$(basename "$f")"
          done
          cp output/"$video_id"/thumbnail*.jpg "$out"/ 2>/dev/null || true
          cp output/"$video_id"/build_report.json "$out"/ 2>/dev/null || true
          cp output/"$video_id"/subtitles.srt "$out"/ 2>/dev/null || true
          du -sh "$out" && ls -la "$out"

      # Голос переживает прогон только в кэше, а кэш терялся уже трижды. Пара
      # «голос + клипы ведущего» при этом неразрывна: переозвучка сдвигает
      # границы фраз, и P6 бракует все клипы разом. Поэтому голос уезжает в
      # репозиторий тем же коммитом, что и превью, — и следующий прогон берёт
      # его шагом «Засеять work/ готовым голосом», ничего не тратя.
      - name: Готовый голос — в репозиторий
        if: success()
        run: |
          set -euo pipefail
          video_id=$(python -c "import json; print(json.load(open('${{ github.event.inputs.script }}', encoding='utf-8'))['meta']['video_id'])")
          src="work/$video_id"
          dst="assets/voice/$video_id"
          if [ -f "$src/voice_final.wav" ]; then
            mkdir -p "$dst"
            cp -v "$src/voice_final.wav" "$dst"/
            for name in speech_map draft_plan validated_script; do
              cp -v "$src/$name.json" "$dst"/ 2>/dev/null || true
            done
            du -sh "$dst"
          else
            echo "голоса в work/ нет — нечего сохранять"
          fi

      - name: Превью, библиотеки и индексы в коммит
        if: success()
        run: |
          set -euo pipefail
          git config user.name  "redshift-bot"
          git config user.email "redshift-bot@users.noreply.github.com"
          git add -A assets config/editing_preferences.json config/pronunciation.json \
                     templates/manifest.json cache/footage_index.json instruction.md \
                     rejected_patterns.md || true
          if git diff --cached --quiet; then
            echo "нечего коммитить"
            exit 0
          fi
          git commit -m "chore(run): превью ролика, библиотеки и индексы после прогона"
          # Ветка за время прогона уходит вперёд — прогон идёт час, а правки
          # продолжаются. Прежний `git push || echo` это прятал: пуш прогона
          # №33478384709 не прошёл молча, и превью не доехало бы никуда.
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            if git fetch origin "$branch" \
               && git rebase "origin/$branch" \
               && git push origin "HEAD:$branch"; then
              echo "запушено с попытки $attempt"
              exit 0
            fi
            git rebase --abort || true
            echo "пуш не прошёл, попытка $attempt"
            sleep $((attempt * 5))
          done
          echo "::error::не удалось запушить превью и индексы"
          exit 1

      - name: Выложить артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redshift-output
          path: |
            output/**/*.mp4
            output/**/*.jpg
            output/**/*.srt
            output/**/*.json
            output/**/logs/**
          retention-days: 14
          if-no-files-found: warn

      # Фаза 1 двухфазного конвейера: ключа HeyGen у прогона нет, поэтому P6
      # останавливается и оставляет заявку с нарезанными кусками речи. По ним
      # аватар генерируется снаружи через MCP-коннектор и возвращается в репо.
      - name: Выложить заявку на аватар
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-request
          path: |
            work/*/avatar_request.json
            work/*/avatar/seg_*.wav
            work/*/voice_final.wav
            work/*/speech_map.json
            work/*/draft_plan.json
            work/*/validated_script.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Итог в Summary
        if: always()
        run: |
          echo "## REDSHIFT — результат прогона" >> $GITHUB_STEP_SUMMARY
          for report in output/*/build_report.json; do
            [ -f "$report" ] || continue
            echo "### $(dirname "$report")" >> $GITHUB_STEP_SUMMARY
            python - "$report" >> $GITHUB_STEP_SUMMARY <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          print(f"- статус: **{data.get('status','?')}**")
          for variant, qc in (data.get("qc") or {}).items():
              status = "✅" if qc.get("passed") else "❌"
              print(f"- версия {variant}: {status} QC "
                    f"({qc.get('passed_count','?')}/{qc.get('total','?')} проверок)")
          PY
          done
