name: voice-probe

# Одна короткая фраза в ElevenLabs — чтобы узнать, что сервис отдаёт на этом
# тарифе: сырой PCM или молча подменённый mp3. Раньше это выяснялось только по
# логу целого прогона за полдоллара; здесь — за цент.
#
# Нужна ровно тогда, когда меняются права ключа или тариф. Регулярного запуска
# у неё нет и быть не должно.

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Фраза для пробы (чем короче, тем дешевле)"
        required: false
        default: "Проверка формата ответа синтеза речи."
      formats:
        description: "Форматы через запятую: перебрать за один запуск"
        required: false
        default: "pcm_44100,mp3_44100_192,mp3_44100_128"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Кэш ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/ffmpeg
          key: ffmpeg-static-linux64-gpl-v1

      - name: Поставить ffmpeg
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.local/ffmpeg/bin/ffmpeg" ]; then
            mkdir -p "$HOME/.local/ffmpeg"
            curl -sSL -o /tmp/ffmpeg.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz -C "$HOME/.local/ffmpeg" --strip-components=1
          fi
          echo "$HOME/.local/ffmpeg/bin" >> "$GITHUB_PATH"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Проба голоса
        run: |
          set -euo pipefail
          mkdir -p work
          python -m src.cli --pretty-logs voice-probe \
            --text "${{ github.event.inputs.text }}" \
            --formats "${{ github.event.inputs.formats }}" \
            --out work/voice_probe.wav | tee work/voice_probe.json

      - name: Итог в Summary
        if: always()
        run: |
          echo '## Проба голоса' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          sed -n '/^{/,$p' work/voice_probe.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-probe
          path: |
            work/voice_probe*.wav
            work/voice_probe.json
          retention-days: 7
          if-no-files-found: ignore
