name: ci

# Тесты и сухой прогон пайплайна в mock-режиме: без единого внешнего вызова,
# без ключей, полностью детерминированно.

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # Та же версия, что и в build-video: она же задаёт ключ кэша Chrome.
  HYPERFRAMES_VERSION: "0.8.2"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установить ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Установить HyperFrames
        run: npm install -g hyperframes@${{ env.HYPERFRAMES_VERSION }}

      - name: Кэш headless Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/hyperframes/chrome
          key: hyperframes-chrome-${{ env.HYPERFRAMES_VERSION }}

      - name: Подготовить Chrome
        run: hyperframes browser ensure

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Шрифты
        run: python -m src.cli fonts-check

      - name: Тесты
        run: python -m pytest tests/ -q --maxfail=1

      - name: Сквозной прогон в mock-режиме
        run: |
          python -m src.cli --set providers.mode=mock --pretty-logs \
            run --script scripts/redshift_0042.json

      - name: Проверить, что ролики собрались и прошли QC
        run: python tools/check_run_artifacts.py output/redshift_0042

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mock-run-output
          path: |
            output/**/*.mp4
            output/**/*.json
            output/**/*.srt
          retention-days: 7

  remotion-typecheck:
    # Альтернативный движок рендера. Проверяем типы: расхождение с форматом
    # edit-плана должно ломать сборку, а не всплывать при рендере.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: render/remotion/package.json
      - name: Установить зависимости
        working-directory: render/remotion
        run: npm install --no-audit --no-fund
      - name: Проверка типов
        working-directory: render/remotion
        run: npx tsc --noEmit
