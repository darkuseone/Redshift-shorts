name: ci

# Тесты и сухой прогон пайплайна в mock-режиме: без единого внешнего вызова,
# без ключей, полностью детерминированно.

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # Та же версия, что в package.json и в build-video: она же задаёт ключ кэша Chrome.
  HYPERFRAMES_VERSION: "0.8.26"

jobs:
  test:
    runs-on: ubuntu-latest
    # Сорока минут перестало хватать: сквозной прогон вырос вместе с поиском.
    # Потолок поднят с запасом, а сам прогон ужат по ширине поиска ниже.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ubuntu-latest не кладёт ffmpeg в PATH, а `apt-get update` на раннере
      # тянет сторонние индексы (Google Chrome). Когда у Chrome Packages.gz
      # не сходится хэш, update выходит 100 и job падает до тестов — так
      # умерли оба `ci / test` на 8d3aa92. Та же установка через apt уже
      # хоронила build-video: зеркало качало libcodec2 минутами.
      #
      # Бинарь — статическая сборка с GitHub Releases, в кэше со второго
      # прогона. Тот же ключ и раскладка, что в build-video.yml.
      - name: Кэш ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/.local/ffmpeg
          key: ffmpeg-static-linux64-gpl-v1

      - name: Поставить ffmpeg
        timeout-minutes: 10
        run: |
          set -euo pipefail
          BIN="$HOME/.local/ffmpeg"
          if [ ! -x "$BIN/ffmpeg" ]; then
            mkdir -p "$BIN"
            curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              -o /tmp/ffmpeg.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz --strip-components=2 -C "$BIN" \
              ffmpeg-master-latest-linux64-gpl/bin/ffmpeg \
              ffmpeg-master-latest-linux64-gpl/bin/ffprobe
            rm -f /tmp/ffmpeg.tar.xz
          fi
          echo "$BIN" >> "$GITHUB_PATH"
          "$BIN/ffmpeg" -version | head -1
          "$BIN/ffprobe" -version | head -1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Установить HyperFrames
        run: |
          npm ci
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> $GITHUB_PATH

      - name: Проверить CLI HyperFrames
        run: |
          hyperframes --version
          version=$(hyperframes --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          test "$version" = "${{ env.HYPERFRAMES_VERSION }}"

      - name: Кэш headless Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/hyperframes/chrome
          key: hyperframes-chrome-${{ env.HYPERFRAMES_VERSION }}

      - name: Подготовить Chrome
        run: hyperframes browser ensure

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Шрифты
        run: python -m src.cli fonts-check

      - name: Тесты
        run: python -m pytest tests/ -q --maxfail=1

      # Прогон здесь доказывает, что конвейер собирается и проходит QC, а не
      # что сток отдаёт хороший материал: материал всё равно синтетический.
      # Поэтому ширина поиска ужата — два запроса на слот вместо четырёх и
      # четыре кандидата вместо восьми. Каждый кандидат в mock-режиме это
      # отдельный вызов ffmpeg, и на полной ширине P7 съедал половину бюджета
      # задачи: прогон 33481687527 сняли по сорокаминутному потолку.
      - name: Сквозной прогон в mock-режиме
        run: |
          python -m src.cli --set providers.mode=mock --pretty-logs \
            --set stock.queries_per_slot=2 \
            --set stock.max_candidates_per_query=4 \
            run --script scripts/redshift_0042.json

      - name: Проверить, что ролики собрались и прошли QC
        run: python tools/check_run_artifacts.py output/redshift_0042

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mock-run-output
          path: |
            output/**/*.mp4
            output/**/*.json
            output/**/*.srt
          retention-days: 7

  remotion-typecheck:
    # Альтернативный движок рендера. Проверяем типы: расхождение с форматом
    # edit-плана должно ломать сборку, а не всплывать при рендере.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: render/remotion/package.json
      - name: Установить зависимости
        working-directory: render/remotion
        run: npm install --no-audit --no-fund
      - name: Проверка типов
        working-directory: render/remotion
        run: npx tsc --noEmit
