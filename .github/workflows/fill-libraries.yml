name: fill-libraries

# Наполнение капнутых библиотек до лимитов §14: SFX = 20, музыка = 5, мемы = 100.
# После достижения лимита генерация блокируется кодом LIBRARY_FROZEN — повторная
# генерация уже имеющегося звука считается ошибкой процесса (§4.4.4).

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "Что доливать"
        required: true
        default: "sfx"
        type: choice
        options: [sfx, music, memes, all]
      dry_run:
        description: "Только показать, что было бы добавлено"
        required: false
        default: false
        type: boolean

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установить ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Долив библиотек
        run: |
          KIND="${{ github.event.inputs.kind }}"
          ARGS=""
          if [ "$KIND" != "all" ]; then ARGS="--kind $KIND"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m src.cli fill-libraries $ARGS

      - name: Состояние библиотек
        run: python -m src.cli libraries | tee library_status.json

      - name: Коммит новых ассетов
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "redshift-bot"
          git config user.email "redshift-bot@users.noreply.github.com"
          git add -A assets
          git diff --cached --quiet || git commit -m "assets: долив библиотек (${{ github.event.inputs.kind }})"
          git push || echo "нечего пушить"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-status
          path: library_status.json
