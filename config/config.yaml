# REDSHIFT — главный конфиг пайплайна.
# Эталон — Приложение A ТЗ v2.0; здесь он расширен полями, без которых
# пайплайн не собирается (провайдеры, пути, рендер, ретраи).
# Ни один секрет здесь не хранится: только имена переменных окружения.

project:
  name: redshift
  language: ru
  fps: 30
  resolution: [1080, 1920]

# --- Режим работы внешних сервисов -------------------------------------------
# live  — всегда реальные API (нет ключа → ошибка)
# mock  — всегда детерминированные заглушки (CI, разработка, тесты)
# auto  — live при наличии ключа в окружении, иначе mock (с warning в лог)
providers:
  mode: auto
  request_timeout_sec: 60
  retries: 3               # §10.5.3: 3 попытки
  backoff_base_sec: 2.0    # экспоненциальный бэкофф 2/4/8

heygen:
  # Аватар 5 заказчика, выдан 24.08. Выданный id — это **группа** («Markus
  # Brown», 78 луков): `get_avatar_look` его не знает, а создание видео просит
  # id лука. Держим оба — группу как то, что дал заказчик, лук как то, что
  # уходит в запрос.
  avatar_group_id: "d0573be250724c23bed61037f1c7490d"
  # Лук «Tattooed creator in neon studio» — выбран заказчиком: оливковая
  # рубашка, татуированные предплечья, камера прямо, микрофон в кадре. Это тот
  # же кадр, что стоит у группы на обложке.
  #
  # Три вещи, которые важно знать про этот лук:
  #   * прозрачность он отдаёт (проверено измерением 26.08: 31 % кадра
  #     непрозрачно, силуэт с микрофоном вырезан чисто);
  #   * приходит он **ландшафтным**, 1920×1080: в кадре стол, руки и стойка —
  #     ровно то, что просили показать. В вертикаль его переводит
  #     `tools/reframe_avatar.py`, окном по измеренной голове;
  #   * матовой полосы студии, как у прошлого лука, здесь нет.
  #
  # Движок — только Avatar V (`avatar_v`), как просил заказчик.
  avatar_id: "99ccc74e764947c394cd4ef210960a6f"
  # Опциональный оверрайд лука из секрета HEYGEN_AVATAR_ID (Avatar 5 look id).
  # Пусто/нет секрета → берём avatar_id выше (зелёная рубашка / тату).
  avatar_id_env: HEYGEN_AVATAR_ID
  # Движок Avatar V — иначе API молча уходит в Avatar IV.
  engine: "avatar_v"
  model_version: "avatar5"                         # §7.4: вынесено в конфиг, не хардкод
  # Источник клипов: api — по ключу, prepared — готовые файлы из репозитория,
  # auto — ключ есть → api, нет ключа но есть клипы → prepared, иначе заглушка.
  # Ключ в GitHub Secrets: HEYGEN_API. Режим auto: есть ключ → live API,
  # нет ключа но есть клипы → prepared, иначе заглушка.
  source: auto
  prepared_dir: assets/avatar_clips
  # Ключевание не нужно: аватар 5 отдаёт настоящую прозрачность. Проверено
  # измерением, а не на слово — 25.08, клип 1080x1920, `output_format: webm`:
  # 47 % кадра полностью прозрачны, 46 % полностью непрозрачны, край мягкий
  # (волосы, дужки очков, штанга микрофона вырезаны чисто).
  #
  # Прошлый лук того же человека (54172d7a…) прозрачности не отдавал ни в
  # mp4, ни в webm, и провайдер верил расширению файла — из-за этого приёмы за
  # головой уходили за непрозрачный план. Теперь альфа измеряется на каждом
  # клипе (`ffmpeg.has_alpha`), а расширение ничего не решает.
  #
  # Тонкость декодера: VP9 держит альфу отдельным блоком контейнера, штатный
  # декодер ffmpeg отдаёт по такому файлу yuv420p — «альфы будто нет».
  # Достаёт её только libvpx-vp9.
  prepared_chroma: ""
  background: "transparent_if_available"
  output: "1080x1920"
  # In-compose zoom for prepared Avatar V plates where the subject sits
  # small in 9:16 (desk-wide look). Applied at shot prepare AND as CSS size
  # on HyperFrames alpha avatars (object-fit path ignored compose_zoom before).
  # Does not rewrite assets/avatar_clips. Measured seg_00 subject ~30% tall →
  # 3.75 was face-filling / too tight on 0042 QA; 2.7 keeps subject large without crop crush.
  compose_zoom: 2.7
  max_seconds_per_video: 42
  api_key_env: HEYGEN_API
  api_base: "https://api.heygen.com"
  poll_interval_sec: 10
  poll_timeout_sec: 900

elevenlabs:
  voice_id_env: ELEVENLABS_VOICE_ID    # клон голоса заказчика
  voice_id: ""                          # можно задать явно; пусто → берётся из env
  # Два клона одного голоса, почти одинаковые. Заказчик разрешил чередовать их
  # между роликами, чтобы канал не звучал одной дорожкой. Выбор идёт по
  # video_id, а не случайно: пересборка того же ролика обязана дать тот же
  # голос, иначе она переозвучит его заново — за деньги и с новыми границами
  # фраз, от которых бракуются уже снятые клипы ведущего.
  voice_pool:
    - "14NozJq5eoBmDc1FXFDq"
    - "7fU3YUxRrVGjNaZ5dzEH"
  model: "eleven_v3"
  fallback_model: "eleven_multilingual_v2"   # R-4
  # Формат ответа. Зависит от тарифа, а не от кода: pcm_* доступен не везде, и
  # на этом ключе PCM недоступен: на запрос pcm_44100 приходит mp3. Замерено
  # пробой голоса — прогоны 33571714855 и 33572242247, шесть замеров:
  #   eleven_v3            pcm_44100 8994 | mp3_192 9636 | mp3_128 8004
  #   eleven_multilingual  pcm_44100 8979 | mp3_192 5856
  # Отсюда две вещи. Первая: mp3_44100_192 — лучший доступный, он и стоит.
  # Вторая: потолок ~9.6 кГц один на все форматы и обе модели, а 192 кбит/с
  # несут около 19 кГц — значит режет не транспорт и не тариф, а сам голос.
  # Клон повторяет полосу записи, с которой снят; поднять её можно только
  # переснятым образцом и новым клоном.
  output_format: "mp3_44100_192"
  # Ниже этой полосы прогон пишет предупреждение: значит, упёрлись в тариф.
  min_bandwidth_hz: 14000
  # Характер подачи. Подбирается на слух, поэтому живёт здесь, а не в коде.
  # stability — ровность чтения: ниже значит шире интонационный размах.
  # На 0.45 разброс громкости готового ролика был 2.0 LU — ровная линия.
  voice_settings:
    stability: 0.30
    similarity_boost: 0.85
    style: 0.45
    use_speaker_boost: true
  # Темп речи ведущего относительно базового. 1.1 — на десятую быстрее: так
  # просил заказчик. Вместе со скоростью на ту же долю сдвигается плановая
  # длительность, иначе коррекция длины вернула бы прежний темп.
  pace: 1.1
  length_buffer_pct: 22                      # §4.2.4: запас +18…25%
  api_key_env: ELEVENLABS_API_KEY
  api_base: "https://api.elevenlabs.io"
  sample_rate: 48000
  # SFX-генерация (только пока библиотека не заполнена до лимита §14.1)
  sfx_model: "eleven_text_to_sound_v2"

vision:
  # Gemini выведен из рабочего набора: ключа под него нет и не планируется.
  # Обе ступени §7.3 ведёт Grok по ключу XAI. Ветка gemini в коде осталась
  # рабочей — включается сменой значения здесь.
  primary: "grok"
  arbiter: "grok"
  arbiter_max_calls: 8        # §7.3 шаг 3
  accept_threshold: 0.70
  reject_threshold: 0.45
  frame_disagreement_threshold: 0.30
  grok_api_key_env: XAI_API_KEY
  grok_model: "grok-4-fast"
  grok_api_base: "https://api.x.ai"
  gemini_api_key_env: GEMINI_API_KEY
  gemini_model: "gemini-2.5-flash"
  gemini_api_base: "https://generativelanguage.googleapis.com"

generation:
  # Кто закрывает пустые слоты §7.3. Magnific выведен из генерации: его HTTP
  # эндпоинт отвечает 404, а MCP-путь живёт в чате, а не в Actions, и списывает
  # кредиты — в прогоне его не вызвать. Сток Magnific при этом остаётся первым
  # источником поиска, он бесплатен и это настоящая съёмка.
  source: grok
  # Слаг снят с живого ответа API: grok-2-image-1212 выведен из обращения
  # 2026-02-24, и сам сервис в тексте ошибки назвал замену. Ради этого модель и
  # вынесена в конфиг — устаревший слаг чинится строкой YAML, а не кодом.
  #
  # Заказчик просит самую качественную модель Imagine. Режим качества сервис
  # берёт полем запроса, а не отдельным слагом, поэтому он вынесен рядом:
  # `grok_image_params` подмешивается в тело запроса как есть. Если сервис
  # поле не примет, прогон не встанет — он перейдёт на запасную модель и
  # скажет об этом в логе, а поле убирается строкой YAML.
  grok_image_model: "grok-imagine-image"
  grok_image_model_fallback: "grok-2-image-1212"
  grok_image_params:
    quality: "high"
    aspect_ratio: "9:16"
    resolution: "2k"
  # Видео Grok не генерирует и не должен: кадр оживляется наездом (§H7 — всё
  # приближается), тем же приёмом Ken Burns, что и фотослоты стока.
  ken_burns_zoom: 1.12

magnific:
  max_downloads_per_video: 80     # raised so P7 force-rebuild can stock avatar BGs
  prefer_free_models: true
  paid_model_share_limit: 0.07
  api_key_env: MAGNIFIC_API_KEY
  api_base: "https://api.magnific.ai"
  # Слаги моделей и реальные цены — config/magnific_models.json, снят через
  # MCP. Безлимит подписки на API не распространяется, поэтому «free» здесь
  # значит «дешёвая»: разброс цен между моделями доходит до ста раз
  # (Classic Fast — 1 кредит, seedance-mini — 700 за пять секунд).
  catalog_file: config/magnific_models.json
  models:
    free_image:  "fast"              # 1 кредит
    paid_image:  "seedream-5-pro"    # 100 кредитов, только под смысловой кадр
    free_video:  "kling-25"          # 140 кредитов за 5 сек
    paid_video:  "bytedance-seedance-pro-2.0"

stock:
  # Перебивка живёт 1.4 секунды ради того, чтобы в кадре что-то произошло.
  # Материал темнее этого показывает субтитр на пустоте: в 0047 так вышло
  # дважды, средняя яркость 17.7 и 20.1 из 255. Замер по базе: медиана
  # 55 % видимого кадра, у виновного клипа 16 %. Общего порога нет
  # намеренно — ночная эстетика канала в длинном кадре законна.
  interstitial_visible_min: 0.20
  # Freepik доступен по подписке Magnific и тем же ключом. Скачивание из
  # каталога кредитов не стоит, поэтому он первый в очереди источников.
  freepik_api_key_env: MAGNIFIC_API_KEY
  pexels_api_key_env: PEXELS_API_KEY
  pixabay_api_key_env: PIXABAY_API_KEY
  # NASA images-api и Internet Archive отдают материал анонимно — ключа нет
  # и не требуется, проверено запросом к images-api.nasa.gov.
  max_candidates_per_query: 14     # aggressive harvest (was 10; still within spirit of §7.2.3)
  queries_per_slot: 7              # more abstraction ladder per slot (was 5)
  target_pool_size: [50, 100]      # larger pool so avatar BGs + templates both get plates
  max_download_height: 1080        # §3.6.1: строго до 1080p, выше не брать
  # Вес принимаемого материала. Хранилище лежит в репозитории, и клип на 45 МБ
  # остаётся в истории git навсегда. Прогон 0047 положил 27 клипов на 369 МБ —
  # при том, что самый длинный слот ролика 6.4 сек, футаж всегда играет с нуля,
  # а звук стока отбрасывается на каждом пути подготовки кадра (-an).
  # Замер самого тяжёлого файла: 45.5 МБ / 65.6 с → 9.8 МБ при SSIM 0.980.
  keep_sec: 20                     # запас втрое к самому длинному слоту
  intake_crf: 23                   # 21 → 12.5 МБ, 23 → 9.8, 26 → 6.7 (SSIM 0.972)
  dedup_hamming_max: 8             # §7.2.5: порог 8/64
  video_probe_frames: [0.10, 0.50, 0.90]

libraries:
  sfx:     { max_items: 20,  frozen_when_full: true }
  # 15, а не 5: заказчик просил «штук десять» разновидностей подложки —
  # динамичную скрипку, тихое пианино, что-нибудь под грустный ролик.
  # Пять дронов такого не дают: у них нет ни нот, ни атаки.
  music:   { max_items: 15,  frozen_when_full: true }
  memes:   { max_items: 100, frozen_when_full: true, per_run_intake: 18 }
  footage: { max_items: null, freeze: false, eviction: lru }

storage:
  # Библиотека отобранного материала живёт **внутри репозитория**, рядом со
  # шрифтами, голосом и клипами ведущего. Так решил заказчик, и так правильно:
  # прогон идёт на чужом раннере, который умирает вместе с задачей, а кэш
  # Actions привязан к конкретному ролику и терялся уже трижды. Единственный
  # канал, переживающий всё, — checkout.
  #
  # Внешнее объектное хранилище (S3) остаётся рабочей веткой кода, но по
  # умолчанию выключено: оно требует бакета и четырёх секретов, а библиотеке
  # такого размера это не нужно.
  #
  # backend: local | s3
  backend: local
  local_root: "assets/footage"
  # 400 МиБ — примерно 200-300 клипов по 3 секунды. Дальше LRU вытесняет самое
  # давно не использованное. Потолок здесь не про диск, а про историю git:
  # удалённый файл остаётся в ней навсегда, и репозиторий растёт необратимо.
  max_bytes: 419430400
  s3:
    bucket_env: REDSHIFT_S3_BUCKET
    endpoint_env: REDSHIFT_S3_ENDPOINT
    access_key_env: REDSHIFT_S3_ACCESS_KEY
    secret_key_env: REDSHIFT_S3_SECRET_KEY
    prefix: "footage/"

features:
  avatar_matting: true      # §7.7 киллсвитч
  background_vfx: true      # зависит от avatar_matting
  ab_versions: true
  auto_topic_search: false
  vision_qc: true           # §11.2 смысловой QC по финальному ролику

limits:
  duration_sec: [35, 70]
  avatar_share: [0.35, 0.60]
  max_event_gap_sec: 2.5
  max_shot_sec: 5
  max_shot_sec_with_events: 7
  min_shot_sec: 1.5                 # §3.6.2
  memes_per_video: [0, 2]
  bg_vfx_per_video: 6
  bg_vfx_sec: [1.5, 8.0]
  # Потолок AI-футажа. Заказчик держит его в вилке 5-35 %: преимущество всегда
  # за настоящим материалом — сток, новостная вырезка, скриншот, кадр из статьи,
  # — а генерация закрывает то, чего не нашлось. Было 0.40, стало 0.35: на 0047
  # доля дошла до 0.38, и три подряд похожих сгенерированных кадра были видны
  # глазом. Нижняя граница — не требование генерировать, а ориентир отчёта.
  ai_footage_share_max: 0.35
  ai_footage_share_target: [0.05, 0.35]
  fullscreen_text_per_video: [2, 4] # §5.2
  highlight_per_video: [1, 3]       # §5.5
  split_share_max: 0.25             # §3.5 режим B ≤25%
  footage_block_share_max: 0.40     # §3.5 режим C ≤40% одним блоком
  first_avatar_appearance_sec: 6.0
  first_event_sec: 0.8
  hook_sec: 3.0
  cta_tail_sec: 2.0
  end_silence_ms: 300
  cut_share_min: 0.70               # §4.3: Cut ≥70% склеек
  dynamic_transition_min_gap_sec: 6.0
  sfx_min_gap_sec: 2.0              # §4.4: плотность SFX ≤ 1 / 2 сек
  quote_max_words: 15
  pillarbox_per_video: 2            # §3.6.5
  gradient_per_video: 1             # §3.3.5
  template_overlap_with_prev_max: 0.20  # QC-6/17
  ab_min_template_diff: 3           # §15.12.2

speech:
  pause_threshold_ms: 150           # §4.2.2 паузы >150 мс режем
  pause_target_ms: [80, 120]
  # Единственная пауза ролика, которую не режут, а держат: перед словом-ударом
  # в блоке-ответе (script_playbook.md §6). Остальные паузы отнимают динамику,
  # эта её создаёт — ответ звучит как ответ, а не как продолжение фразы.
  # 0 выключает приём.
  punch_hold_ms: 320
  breath_max_ms: 400
  silence_floor_db: -42.0
  min_word_ms: 250                  # §5.1 длительность слова 250–450 мс
  max_word_ms: 450

audio:
  voice_lufs: -14
  # Уровень подложки задан долей от голоса, а не абсолютным LUFS: заказчик
  # думает именно так — «5-7% громкости от моего голоса», — и всякий раз
  # переводить это в LUFS руками значит однажды перевести неверно.
  #
  # 0.07 амплитуды = -23.1 дБ относительно голоса. При voice_lufs -14 это
  # -37.1 LUFS. Заказчик слышал 6 % (середину коридора 5-7 %) и попросил
  # верхнюю границу: «нормально можешь сделать даже 7%». Поэтому здесь одно
  # число, а не вилка — обе границы равны 0.07.
  #
  # Почему такая тихая подложка слышна, а прежняя на -32 LUFS не была:
  # у синтезированных бедов 95 % энергии лежало ниже 1576 Гц, то есть в
  # полосе, которую динамик телефона не отдаёт. Живая запись занимает всю
  # полосу, и на -37 LUFS её слышно там, где синтетику не было слышно на -32.
  music_voice_ratio: [0.07, 0.07]
  # Запасной коридор, если доля не задана: то же число, но абсолютным.
  music_lufs: [-38, -36]
  ducking_db: -7
  true_peak_max: -1
  sfx_peak_dbfs: [-16, -12]
  sample_rate: 48000
  channels: 2

render:
  # hyperframes — основной движок: кадр описывается разметкой и собирается
  # headless Chrome. ffmpeg остаётся на нарезке, обрезке и сведении звука,
  # remotion — вспомогательный движок с той же схемой edit-плана.
  engine: hyperframes      # hyperframes | ffmpeg | remotion
  hyperframes_quality: high
  crf: 19                  # §3.1: CRF 18–20
  preset: "medium"
  video_codec: "libx264"
  profile: "high"
  pix_fmt: "yuv420p"
  audio_codec: "aac"
  audio_bitrate: "224k"
  color_primaries: "bt709"
  faststart: true
  ab_versions: ["A", "B"]
  # Shorts cover: Grok Imagine 9:16 (XAI_API_KEY). ffmpeg frame @1s is fallback
  # only — a random early frame is not a publishable thumb.
  thumbnail_mode: "grok"
  thumbnail_time_sec: 1.0
  thumbnail_grok_params:
    aspect_ratio: "9:16"
    resolution: "2k"
    quality: "high"

news:
  # §7.5 — квоты бюджетируются и кэшируются
  quotas: { currents: 250, apitube: 100, gdelt: 100 }
  freshness_hours: 48
  dedup_title_fuzzy: 0.85
  keywords: [ai, space, quantum, biotech, "climate tech", neuro, longevity]

budget:
  max_cost_per_video_usd: 6.00
  hard_stop_on_exceed: true
