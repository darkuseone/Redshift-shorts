# Стоки, лицензии и приоритеты (§7.2, §10.4).
# `license_check: per_item` означает, что лицензия проверяется у каждого объекта
# отдельно и не может быть принята «по умолчанию для источника».

sources:
  nasa:
    kind: api
    enabled: true
    license: "public-domain"          # §10.4: в основном PD
    license_check: per_item           # часть материалов NASA — чужие, проверяем
    attribution_required: false
    notes: "Логотипы NASA нельзя использовать как знак поддержки/одобрения."
    api_base: "https://images-api.nasa.gov"
    media: [video, photo]

  esa:
    kind: api
    enabled: true
    license: "ESA-CC-BY-SA-3.0-IGO"
    license_check: per_item
    attribution_required: true
    api_base: "https://www.esa.int"
    media: [video, photo]

  freepik:
    kind: api
    enabled: true
    license: "Freepik License"
    license_check: per_item           # часть каталога свободна, часть по подписке
    attribution_required: false
    notes: >
      Доступен по подписке Magnific тем же ключом. Скачивание из каталога не
      стоит кредитов — в отличие от генерации (от 140 кредитов за 5 сек видео),
      поэтому идёт первым в очереди. Материал с premium: true доступен, пока
      действует подписка; это помечается в манифесте.
    api_base: "https://api.freepik.com/v1"
    media: [video, photo]

  pexels:
    kind: api
    enabled: true
    license: "Pexels License"
    license_check: source_default
    attribution_required: false
    restrictions:
      - "нельзя порочащий контекст с узнаваемыми людьми"
      - "нельзя перепродавать как сток"
    api_base: "https://api.pexels.com"
    media: [video, photo]

  pixabay:
    kind: api
    enabled: true
    license: "Pixabay Content License"
    license_check: source_default
    attribution_required: false
    restrictions:
      - "нельзя перепродавать как сток"
    api_base: "https://pixabay.com/api"
    media: [video, photo]

  mixkit:
    kind: catalog
    enabled: true
    license: "Mixkit Free License"
    license_check: source_default
    attribution_required: false
    restrictions:
      - "бесплатно для коммерции, нельзя распространять как сток"
    media: [video]

  internet_archive:
    kind: api
    enabled: true
    license: "varies"
    license_check: per_item           # §10.4, R-10 — попозиционно, обязательно
    attribution_required: true
    api_base: "https://archive.org"
    media: [video, photo]

  # Кадр со страницы самой статьи, которую ролик и так цитирует: домен в этот
  # момент стоит на экране карточкой источника, ссылка уходит в манифест.
  # `license_check: owner_decision` — единственное место, где лицензия
  # принимается без подтверждения, и оно названо поимённо: у издания кадр чаще
  # всего сам лицензирован у агентства, подтвердить это со стороны нечем.
  # Решение принимает владелец канала; выключается строкой `enabled: false`.
  press:
    kind: page
    enabled: true
    license: "editorial-quote"
    license_check: owner_decision
    attribution_required: true
    notes: >
      Берётся только для слотов доказательства, у которых блок ссылается на
      источник: кадр иллюстрирует ту самую статью, а не «что-нибудь по теме».
      Кредит на экране обязателен (§1, правило 8).
    media: [photo]

  magnific:
    kind: generation
    enabled: true
    license: "generated-owned"
    license_check: source_default
    attribution_required: false
    media: [video, photo]

  footage_net:
    kind: aggregator
    enabled: false                    # §10.4: платный агрегатор, в free-tier пул не включать
    license: "commercial-paid"
    license_check: per_item
    media: [video]

# Приоритеты источников по типу запроса (§7.2)
# magnific в конце каждой строки — это генерация, и она платная: 140 кредитов
# за 5 секунд видео против нуля за скачивание из каталога. Freepik стоит рядом
# с бесплатными стоками, потому что он тоже каталог, а не генератор.
routing:
  space:      [nasa, esa, internet_archive, freepik, magnific]
  astro:      [nasa, esa, internet_archive, freepik, magnific]
  news:       [pexels, freepik, internet_archive, magnific]
  lab:        [freepik, pexels, pixabay, magnific]
  biotech:    [freepik, pexels, pixabay, magnific]
  medicine:   [freepik, pexels, pixabay, magnific]
  city:       [pexels, freepik, mixkit, pixabay]
  people:     [pexels, freepik, mixkit, pixabay]
  reportage:  [pexels, freepik, mixkit, pixabay]
  servers:    [freepik, pexels, magnific]
  interface:  [freepik, pexels, magnific]
  archive:    [internet_archive]
  history:    [internet_archive]
  dataviz:    [freepik, magnific, pexels]
  logo:       [freepik, magnific]
  default:    [freepik, pexels, pixabay, magnific]

# Запрещённые типы материала (§10.4)
forbidden:
  - "фрагменты фильмов"
  - "фрагменты ТВ-эфира"
  - "фрагменты интервью третьих лиц"
  - "материалы с водяными знаками"
  - "материалы с чужим брендингом на весь кадр"
