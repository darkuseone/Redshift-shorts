# Стоки, лицензии и приоритеты (§7.2, §10.4).
# `license_check: per_item` означает, что лицензия проверяется у каждого объекта
# отдельно и не может быть принята «по умолчанию для источника».

sources:
  nasa:
    kind: api
    enabled: true
    license: "public-domain"          # §10.4: в основном PD
    license_check: per_item           # часть материалов NASA — чужие, проверяем
    attribution_required: false
    notes: >
      NASA Images API — PD generally, но 3rd-party без поля прав в API.
      Фильтр текстовых «copyright …»; не качать meatball/worm как бренд.
      Берём ~large/~medium и короткая сторона ≤1080. SVS можно (есть width/height), 4K режем.
    api_base: "https://images-api.nasa.gov"
    media: [video, photo]

  esa:
    kind: html
    enabled: false                    # нет public search API; yaml не врёт про live
    live: false
    research_only: true
    license: "ESA Standard Licence"
    license_check: per_item
    attribution_required: true
    on_screen_credit: true
    notes: >
      Default esa.int multimedia = ESA Standard Licence (editorial/educational
      social OK; commercial entertainment/ads нужен written authorisation).
      Это НЕ CC-BY-SA на весь esa.int. Публичного ESA multimedia API нет
      (HTML dlmultimedia.esa.int). Live выключен. Космос: Hubble/Webb/ESO CC BY 4.0.
    media: [video, photo]

  freepik:
    kind: api
    enabled: true
    license: "Freepik License"
    license_check: per_item           # часть каталога свободна, часть по подписке
    attribution_required: true            # free tier Freepik требует attribution
    notes: >
      Доступен по подписке Magnific тем же ключом. Скачивание из каталога не
      стоит кредитов — в отличие от генерации (от 140 кредитов за 5 сек видео),
      поэтому идёт первым в очереди. Смотреть licenses[].type: free требует
      attribution; editorial-only не в monetized Short. Материал с premium: true
      доступен, пока действует подписка; это помечается в манифесте.
    api_base: "https://api.freepik.com/v1"
    media: [video, photo]

  pexels:
    kind: api
    enabled: true
    license: "Pexels License"
    license_check: source_default
    attribution_required: false
    restrictions:
      - "нельзя порочащий контекст с узнаваемыми людьми"
      - "нельзя перепродавать как сток"
    api_base: "https://api.pexels.com"
    media: [video, photo]

  pixabay:
    kind: api
    enabled: true
    license: "Pixabay Content License"
    license_check: source_default
    attribution_required: false
    restrictions:
      - "нельзя перепродавать как сток"
    api_base: "https://pixabay.com/api"
    media: [video, photo]

  mixkit:
    kind: catalog
    enabled: false                    # per-item не парсится → не live
    live: false
    license: "Mixkit per-item (videoFree | videoRestricted)"
    license_check: per_item
    attribution_required: false
    restrictions:
      - "videoRestricted нельзя на monetized канал"
      - "live выключен, пока нет парсера data-license (SHOULD-003)"
    notes: >
      Лицензия per-item: data-license=videoFree|videoRestricted. Restricted =
      нельзя monetized. Публичного API нет. Mock остаётся для тестов; в routing
      mixkit не вызывается.
    media: [video]

  hubble:
    kind: json
    enabled: false                    # клиент JSON — SHOULD-004, не этот тикет
    live: false
    license: "CC BY 4.0"
    license_check: source_default
    attribution_required: true
    on_screen_credit: true
    notes: >
      ESA/Hubble images JSON, CC BY 4.0. Кредит в кадре или end card, не только
      в description. Live не включаем без клиента.
    media: [photo, video]

  webb:
    kind: json
    enabled: false
    live: false
    license: "CC BY 4.0"
    license_check: source_default
    attribution_required: true
    on_screen_credit: true
    notes: >
      ESA/Webb images JSON, CC BY 4.0. Кредит в кадре или end card.
      Videos JSON webb — не подтверждено, не live.
    media: [photo]

  eso:
    kind: json
    enabled: false
    live: false
    license: "CC BY 4.0"
    license_check: source_default
    attribution_required: true
    on_screen_credit: true
    notes: >
      ESO public images/videos JSON, CC BY 4.0. Кредит в кадре или end card.
      Сервер иногда 400 без browser UA. Live не включаем без клиента.
    media: [photo, video]

  internet_archive:
    kind: api
    enabled: true
    license: "varies"                 # PD / CC0 / BY / BY-SA; NC/ND и пустой licenseurl — drop
    license_check: per_item           # §10.4, R-10 — попозиционно, обязательно
    attribution_required: true
    notes: >
      Whitelist: publicdomain, CC0, CC BY, CC BY-SA. NC/ND и пустой licenseurl
      не подтверждены. Wikimedia per-item LicenseShortName — не этот клиент.
    api_base: "https://archive.org"
    media: [video, photo]

  # Кадр со страницы самой статьи, которую ролик и так цитирует: домен в этот
  # момент стоит на экране карточкой источника, ссылка уходит в манифест.
  # `license_check: owner_decision` — единственное место, где лицензия
  # принимается без подтверждения, и оно названо поимённо: у издания кадр чаще
  # всего сам лицензирован у агентства, подтвердить это со стороны нечем.
  # Решение принимает владелец канала; выключается строкой `enabled: false`.
  press:
    kind: page
    enabled: true
    license: "editorial-quote"
    license_check: owner_decision
    attribution_required: true
    notes: >
      Берётся для слотов доказательства: кадр со страницы статьи (og:image,
      json-ld) и, если источник — Wikipedia или у статьи есть title, thumbnail
      из REST Википедии. Официальный кадр важнее стока «по теме». Кредит на
      экране обязателен (§1, правило 8).
    media: [photo]

  magnific:
    kind: generation
    enabled: true
    license: "generated-owned"
    license_check: source_default
    attribution_required: false
    media: [video, photo]

  footage_net:
    kind: aggregator
    enabled: false                    # §10.4: платный агрегатор, в free-tier пул не включать
    license: "commercial-paid"
    license_check: per_item
    media: [video]

# Приоритеты источников по типу запроса (§7.2)
# magnific в конце каждой строки — это генерация, и она платная: 140 кредитов
# за 5 секунд видео против нуля за скачивание из каталога. Freepik стоит рядом
# с бесплатными стоками, потому что он тоже каталог, а не генератор.
routing:
  space:      [nasa, internet_archive, freepik, magnific]
  astro:      [nasa, internet_archive, freepik, magnific]
  news:       [pexels, freepik, internet_archive, magnific]
  lab:        [freepik, pexels, pixabay, magnific]
  biotech:    [freepik, pexels, pixabay, magnific]
  medicine:   [freepik, pexels, pixabay, magnific]
  city:       [pexels, freepik, pixabay]
  people:     [pexels, freepik, pixabay]
  reportage:  [pexels, freepik, pixabay]
  servers:    [freepik, pexels, magnific]
  interface:  [freepik, pexels, magnific]
  archive:    [internet_archive]
  history:    [internet_archive]
  dataviz:    [freepik, magnific, pexels]
  logo:       [freepik, magnific]
  default:    [freepik, pexels, pixabay, magnific]

# Запрещённые типы материала (§10.4)
forbidden:
  - "фрагменты фильмов"
  - "фрагменты ТВ-эфира"
  - "фрагменты интервью третьих лиц"
  - "материалы с водяными знаками"
  - "материалы с чужим брендингом на весь кадр"
